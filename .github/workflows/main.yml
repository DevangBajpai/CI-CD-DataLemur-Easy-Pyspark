name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Databricks CLI (Dev)
      - name: Setup Databricks CLI (Dev)
        uses: databricks/setup-cli@main
        with:
          databricks-host: ${{ secrets.DEVELOPMENT_URL }}
          databricks-token: ${{ secrets.DEVELOPMENT_TOKEN }}

      # Step 3: Test CLI authentication
      - name: Test Databricks CLI
        run: databricks workspace list /Workspace/Users

      # Step 4: Deploy notebooks to Dev folder
      - name: Deploy notebooks to Dev
        run: |
          echo "Deploying notebooks to DEV workspace..."
          databricks workspace import-dir notebooks/dev "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)" --overwrite

      # Step 5: Run validation job in Dev
      - name: Run validation job in Dev
        run: |
          echo "Running validation job in DEV..."
          databricks jobs run-now --job-id ${{ secrets.DATABRICKS_DEV_JOB_ID }}

  promote-to-prod:
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.ref == 'refs/heads/main'
    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Databricks CLI (Prod) - same workspace/creds
      - name: Setup Databricks CLI (Prod)
        uses: databricks/setup-cli@main
        with:
          databricks-host: ${{ secrets.DEVELOPMENT_URL }}
          databricks-token: ${{ secrets.DEVELOPMENT_TOKEN }}

      # Step 3: Deploy notebooks to Prod folder
      - name: Deploy notebooks to Prod
        run: |
          echo "Deploying notebooks to PROD workspace..."
          databricks workspace import-dir notebooks/prod "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)" --overwrite

      # Step 4: Run production job
      - name: Run production job
        run: |
          echo "Running PROD job..."
          databricks jobs run-now --job-id ${{ secrets.DATABRICKS_PROD_JOB_ID }}
