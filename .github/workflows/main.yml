name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Databricks CLI (new unified)
        run: pip install databricks-cli

      - name: Configure Databricks CLI auth
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ secrets.DEVELOPMENT_URL }}
          token = ${{ secrets.DEVELOPMENT_TOKEN }}
          EOF

      - name: Deploy to DEV
        run: |
          echo "Deploying notebooks to DEV..."
          for file in $(find . -type f -name "*.dbc" -o -name "*.py" -o -name "*.ipynb"); do
            echo "Importing $file"
            databricks workspace import "$file" "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)/$(basename $file)" --overwrite
          done

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying notebooks to PROD..."
          for file in $(find . -type f -name "*.dbc" -o -name "*.py" -o -name "*.ipynb"); do
            echo "Importing $file"
            databricks workspace import "$file" "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)/$(basename $file)" --overwrite
          done
