name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install Databricks CLI (old CLI)
      - name: Install Databricks CLI
        run: pip install databricks-cli==0.18.0

      # Step 3: Configure Databricks auth
      - name: Configure Databricks CLI
        run: |
          databricks configure --token <<EOF
          ${{ secrets.DEVELOPMENT_URL }}
          ${{ secrets.DEVELOPMENT_TOKEN }}
          EOF

      # Step 4: Deploy notebooks to DEV
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "Deploying notebooks to DEV..."
          for file in $(find . -type f -name "*.py" -o -name "*.ipynb"); do
            echo "Importing $file"
            databricks workspace import "$file" \
              "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)/$(basename $file)" \
              --overwrite --language PYTHON
          done

      # Step 5: Deploy notebooks to PROD (only on main)
      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying notebooks to PROD..."
          for file in $(find . -type f -name "*.py" -o -name "*.ipynb"); do
            echo "Importing $file"
            databricks workspace import "$file" \
              "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)/$(basename $file)" \
              --overwrite --language PYTHON
          done
