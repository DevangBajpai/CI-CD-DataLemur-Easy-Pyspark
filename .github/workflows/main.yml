name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Databricks CLI (new)
        run: pip install databricks-cli --upgrade

      - name: Configure Databricks auth
        run: |
          databricks auth login \
            --host ${{ secrets.DEVELOPMENT_URL }} \
            --token ${{ secrets.DEVELOPMENT_TOKEN }}

      - name: Deploy to DEV
        run: |
          echo "Deploying notebooks to DEV..."
          databricks workspace import-paths \
            . \
            "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)" \
            --overwrite

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying notebooks to PROD..."
          databricks workspace import-paths \
            . \
            "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)" \
            --overwrite
