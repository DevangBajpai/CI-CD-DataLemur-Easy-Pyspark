name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks auth
        run: |
          databricks configure --token <<EOF
          ${{ secrets.DEVELOPMENT_URL }}
          ${{ secrets.DEVELOPMENT_TOKEN }}
          EOF

      - name: Deploy to DEV
        run: |
          echo "Deploying notebooks to DEV..."
          databricks workspace import-dir \
            . \
            "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)" \
            --overwrite

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying notebooks to PROD..."
          databricks workspace import-dir \
            . \
            "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)" \
            --overwrite
