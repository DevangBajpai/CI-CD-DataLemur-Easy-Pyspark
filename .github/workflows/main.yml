name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEV_REPO_PATH: "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)"
      PROD_REPO_PATH: "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)"
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install Databricks CLI (old CLI, stable)
      - name: Install Databricks CLI
        run: pip install databricks-cli

      # Step 3: Configure Databricks CLI authentication
      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF

      # Step 4: Deploy to DEV or PROD
      - name: Deploy to Databricks Repo
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev" ]; then
            echo "Deploying to DEV..."
            databricks repos update --path "${DEV_REPO_PATH}" --branch "dev"
          elif [ "$BRANCH" = "main" ]; then
            echo "Deploying to PROD..."
            databricks repos update --path "${PROD_REPO_PATH}" --branch "main"
          else
            echo "Branch is neither dev nor main. Skipping deployment."
          fi
