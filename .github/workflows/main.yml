name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEV_REPO_PATH: "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Dev)"
      PROD_REPO_PATH: "/Workspace/Users/devangbajpai7@gmail.com/CI-CD-DataLemur-Easy-Pyspark (Prod)"

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install Databricks CLI v0.205.0+ (latest unified auth)
      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      # Configure Databricks CLI (write $HOME/.databrickscfg from secrets)
      - name: Configure Databricks CLI
        run: |
          mkdir -p $HOME
          CONFIG_FILE=$HOME/.databrickscfg
          echo "[DEFAULT]" > $CONFIG_FILE
          echo "host = ${{ secrets.DEPLOYMENT_URL }}" >> $CONFIG_FILE
          echo "token = ${{ secrets.DEPLOYMENT_TOKEN }}" >> $CONFIG_FILE
          chmod 600 $CONFIG_FILE
          echo "✅ Databricks config written"

      # Test that CLI auth works
      - name: Test CLI Authentication
        run: databricks workspace list / | head -5

      # Deploy Notebooks based on branch
      - name: Deploy Notebooks
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "Deploying to DEV..."
            databricks repos update "${DEV_REPO_PATH}" --branch "dev"
          elif [ "$BRANCH" = "main" ]; then
            echo "Deploying to PROD..."
            databricks repos update "${PROD_REPO_PATH}" --branch "main"
          else
            echo "Branch is neither dev nor main. Skipping deployment."
          fi
